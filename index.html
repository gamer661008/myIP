<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Network Intelligence</title>
    <!-- 引入官方 Tailwind CSS (確保 CDN 100% 載入) -->
    <script src="https://tailwindcss.com"></script>
    <style>
        /* 內建 iOS 系統核心底色與蘋果字型，不再依賴外部 CSS */
        body {
            background-color: #f2f2f7 !important;
            color: #1c1c1e !important;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif !important;
            -webkit-font-smoothing: antialiased;
        }
        /* iOS 精緻磨砂毛玻璃卡片 */
        .ios-card {
            background-color: rgba(255, 255, 255, 0.9) !important;
            border: 1px solid #e5e5ea !important;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04) !important;
        }
        /* iOS 常駐底部毛玻璃列 */
        .ios-cookie-banner-box {
            background-color: rgba(255, 255, 255, 0.85) !important;
            backdrop-filter: blur(20px) !important;
            -webkit-backdrop-filter: blur(20px) !important;
            border-top: 1px solid rgba(0, 0, 0, 0.05) !important;
            box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.06) !important;
        }
        /* 列表細線分割 */
        .ios-row {
            border-bottom: 1px solid #f2f2f7 !important;
        }
        .ios-row:last-child {
            border-bottom: none !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between pt-6 pb-32 px-4 sm:px-6 lg:px-8 bg-[#f2f2f7]">

    <!-- 頂部列：語言切換 -->
    <header class="max-w-2xl w-full mx-auto flex justify-end items-center mb-6">
        <div class="bg-white/60 backdrop-blur-md px-3 py-1.5 rounded-full border border-black/5 text-xs text-[#636366]">
            <span class="font-semibold uppercase tracking-wide mr-1">Language</span>
            <select id="langSelector" class="bg-transparent font-medium text-[#1c1c1e] outline-none cursor-pointer">
                <option value="zh-TW">繁體中文</option>
                <option value="zh-CN">簡體中文</option>
                <option value="ja">日本語</option>
                <option value="ko">한국어</option>
                <option value="ru">Русский</option>
            </select>
        </div>
    </header>

    <!-- 主體內容：iOS 弧形儀表板 -->
    <main class="max-w-2xl w-full mx-auto ios-card rounded-2xl p-6 sm:p-8 my-auto bg-white shadow-sm">
        
        <!-- 標題區 -->
        <div class="text-center mb-6 border-b border-[#f2f2f7] pb-5">
            <h1 id="mainTitle" class="text-xl sm:text-2xl font-bold tracking-tight text-[#1c1c1e]">IP 網路情報查詢</h1>
            <p id="descText" class="text-xs text-[#8e8e93] mt-1 font-medium">快速解析 IP 位址之電信商、ASN 與連線類型</p>
        </div>

        <!-- 查詢輸入區 -->
        <div class="mb-6 flex flex-col sm:flex-row gap-3 items-center w-full">
            <input type="text" id="ipInput" placeholder="e.g., 8.8.8.8" class="w-full flex-1 bg-[#f2f2f7] border border-transparent focus:border-[#007aff] focus:bg-white px-4 py-3 text-sm rounded-xl text-[#1c1c1e] outline-none transition-all duration-200 shadow-inner">
            <button id="searchBtn" class="w-full sm:w-auto bg-[#007aff] hover:bg-[#0066d6] text-white font-semibold px-8 py-3 rounded-xl transition-all duration-200 text-sm tracking-wide shadow-sm active:scale-95 cursor-pointer">
                查詢
            </button>
        </div>

        <!-- 結果展示面板 (iOS System Rows Layout) -->
        <div class="flex flex-col text-sm bg-white rounded-xl overflow-hidden px-1">
            <div class="ios-row flex justify-between items-center py-3.5">
                <span id="labelIp" class="font-medium text-[#3a3a3c]">🔍 查詢 IP</span>
                <span id="valIp" class="font-mono text-[#007aff] font-semibold bg-[#e5f1ff] px-2.5 py-0.5 rounded-md text-xs">--</span>
            </div>
            <div class="ios-row flex justify-between items-center py-3.5">
                <span id="labelIsp" class="font-medium text-[#3a3a3c]">🏢 ISP / 營運商</span>
                <span id="valIsp" class="text-[#1c1c1e] font-medium text-right">--</span>
            </div>
            <div class="ios-row flex justify-between items-center py-3.5">
                <span id="labelAsn" class="font-medium text-[#3a3a3c]">📜 ASN (自主系統)</span>
                <span id="valAsn" class="font-mono text-[#1c1c1e] bg-[#f2f2f7] px-2 py-0.5 rounded-md text-xs">--</span>
            </div>
            <div class="ios-row flex justify-between items-center py-3.5">
                <span id="labelType" class="font-medium text-[#3a3a3c]">⚡ 連線類型</span>
                <span id="valType" class="text-[#1c1c1e] font-medium">--</span>
            </div>
            <div class="ios-row flex justify-between items-center py-3.5">
                <span id="labelLocation" class="font-medium text-[#3a3a3c]">📍 地理位置</span>
                <span id="valLocation" class="text-[#1c1c1e] font-medium text-right">--</span>
            </div>
        </div>

        <!-- iOS 預留廣告框 (CLS 防抖) -->
        <div class="w-full h-[250px] bg-[#fafafc] border border-[#e5e5ea] mt-6 rounded-xl flex items-center justify-center relative overflow-hidden">
            <div class="absolute text-center pointer-events-none select-none">
                <span class="text-[10px] block font-semibold text-[#8e8e93] tracking-wider uppercase">Advertisement</span>
                <span id="adStatusText" class="text-[10px] text-[#aeaeb2]">正在等待隱私權許可...</span>
            </div>
            <div id="realAdSlot" class="w-full h-full flex items-center justify-center z-10"></div>
        </div>
    </main>

    <!-- iOS 橫條型底部 Cookie 同意列 -->
    <div id="cookieBanner" class="fixed bottom-0 left-0 right-0 z-50 ios-cookie-banner-box hidden px-4 py-4 sm:px-6">
        <div class="max-w-4xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-start space-x-3 text-left w-full md:w-3/5">
                <span class="text-lg select-none">🛡️</span>
                <div>
                    <h3 id="cookieTitle" class="font-bold text-xs sm:text-sm text-[#1c1c1e] mb-0.5">隱私權與 Cookie 聲明</h3>
                    <p id="cookieText" class="text-[11px] sm:text-xs text-[#636366] leading-normal框">
                        為了維持工具的正常運作，本網站使用 Cookie 記錄必要情報並提供適當的廣告。點選「接受」即代表您同意此規範。
                    </p>
                </div>
            </div>
            <div class="flex items-center justify-end gap-3 w-full md:w-auto shrink-0 border-t md:border-t-0 pt-2 md:pt-0 border-gray-100">
                <button id="cookieDeclineBtn" class="bg-[#e5e5ea] hover:bg-[#d1d1d6] text-[#007aff] px-4 py-2 text-xs font-semibold rounded-lg transition-all cursor-pointer">
                    拒絕
                </button>
                <button id="cookieAcceptBtn" class="bg-[#1c1c1e] hover:bg-[#2c2c2e] text-white px-6 py-2 text-xs font-bold rounded-lg transition-all tracking-wide shadow-sm cursor-pointer">
                    接受
                </button>
            </div>
        </div>
    </div>

    <!-- 頁尾 -->
    <footer class="text-center text-[11px] text-[#8e8e93] font-medium mt-6">
        <p>© 2026 Network Intelligence. All Rights Reserved.</p>
    </footer>

    <!-- 引入原本已修正好的外部腳本 script.js -->
    <script src="script.js"></script>
</body>
</html>
